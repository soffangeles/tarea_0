name: Validacion de Registro

on: [push]

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del alumno
        uses: actions/checkout@v4

      - name: Descargar evaluador secreto
        uses: actions/checkout@v4
        with:
          repository: Simulacion-Estocastica-2027-1/evaluadores
          token: ${{ secrets.SECRET_TOKEN }}
          path: .calificador

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2

      - name: Ejecutar pruebas
        run: |
          python3 .calificador/tarea_0/validador_python.py
          Rscript .calificador/tarea_0/validador_r.R
